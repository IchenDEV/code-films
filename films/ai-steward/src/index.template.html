<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AI 越来越能干，人为什么越来越忙？</title>
    <script src="assets/gsap.min.js"></script>

    <style>
      @font-face { font-family: "Xiaolai"; src: url("assets/Xiaolai-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC"); font-weight: 400; }
      @font-face { font-family: "Noto Sans CJK SC"; src: local("Noto Sans CJK SC Bold"); font-weight: 700; }
      :root { --ink: #23262d; --board: #f6f4ee; --grey: #8a8f98; --orange: #e8772e; --blue: #2463a6; --green: #2c9a5a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--board); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--ink); font-family: "Xiaolai", "Noto Sans CJK SC", sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #bg { background:
        radial-gradient(1600px 900px at 30% 20%, rgba(255,255,255,.75), rgba(255,255,255,0) 60%),
        radial-gradient(1200px 800px at 85% 90%, rgba(210,205,192,.35), rgba(210,205,192,0) 70%),
        linear-gradient(180deg, #f8f6f1, #f1eee6); }
      #ghost { opacity: .05; background-image:
        radial-gradient(420px 120px at 22% 34%, #6b7280, transparent 70%),
        radial-gradient(520px 140px at 70% 62%, #6b7280, transparent 70%),
        radial-gradient(300px 90px at 50% 85%, #6b7280, transparent 70%); }
      #grain { pointer-events: none; opacity: .22; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.53  0 0 0 0 0.5  0 0 0 0.35 0'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>"); }
      #vig { pointer-events: none; background: radial-gradient(1500px 950px at 50% 50%, rgba(0,0,0,0) 60%, rgba(60,55,45,.16) 100%); }
      #cam { transform-origin: 960px 540px; }
      #world { position: absolute; left: 0; top: 0; width: 5760px; height: 2160px; }
      #board { position: absolute; left: 0; top: 0; overflow: visible; }
      #board text { font-family: "Xiaolai", "Noto Sans CJK SC", sans-serif; }
      #title .tl { position: absolute; left: 0; right: 0; text-align: center; font-size: 84px; letter-spacing: .04em; color: var(--ink); white-space: nowrap; }
      #title .t1 { top: 352px; }
      #title .t2 { top: 470px; }
      #title .t3 { top: 640px; font-size: 26px; letter-spacing: .4em; color: var(--grey); font-family: "Noto Sans CJK SC", sans-serif; }
      .sub { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: 1640px; text-align: center; white-space: nowrap;
        font-family: "Noto Sans CJK SC", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.4; letter-spacing: .03em; color: #1d2027;
        padding: 6px 26px 8px; border-radius: 12px; background: rgba(250, 249, 245, 0.9); box-shadow: 0 2px 10px rgba(60, 55, 45, 0.12); }
      #endScrim { background: rgba(246, 244, 238, 0.86); }
      #endc .e1 { position: absolute; left: 0; right: 0; top: 404px; text-align: center; font-size: 76px; letter-spacing: .05em; color: var(--ink); white-space: nowrap; }
      #endc .e2 { position: absolute; left: 0; right: 0; top: 534px; text-align: center; font-size: 32px; letter-spacing: .2em; color: #5d6470; white-space: nowrap; }
      #endc .e3 { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 22px; letter-spacing: .5em; color: var(--grey); font-family: "Noto Sans CJK SC", sans-serif; }
      #endc .hl { position: absolute; left: 520px; top: 476px; width: 880px; height: 26px; background: rgba(255, 214, 64, 0.55); border-radius: 13px; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080">
      <div id="stage" class="layer">
        <div id="bg" class="layer"></div>
        <div id="ghost" class="layer"></div>
        <div id="cam" class="layer"><div id="world"><svg id="board" width="5760" height="2160" viewBox="0 0 5760 2160" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
        <div id="title" class="layer"></div>
        <div id="endScrim" class="layer"></div>
        <div id="endc" class="layer"></div>
