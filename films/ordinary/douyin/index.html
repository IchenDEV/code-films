<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>凡人 · 抖音版</title>
<!-- 相对路径都按原片目录解析：原片的镜头、档案图（img/）、film.json（预载图片清单）、原片时间轴都在那里 -->
<base href="../">
<style>
  html, body { margin: 0; background: #000; color: #bbb; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: 0 auto; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
        padding: 10px 16px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  #ui input { flex: 1; }
  #ui button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 12px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" hidden>
  <button id="play">播放 / 暂停</button>
  <input id="t" type="range" min="0" step="0.01" value="0">
  <span id="lab">0.00s</span>
  <audio id="aud" preload="auto"></audio>
</div>
<!-- 原片时间轴（window.TL：镜头内对位、闪电、剪辑点、屏幕逐字）与抖音版时间轴（window.CUT） -->
<script src="timeline_zh.js"></script>
<script src="douyin/timeline/douyin.js"></script>
<script src="selfdata.js"></script>
<script src="../../engine/web/core.js"></script>
<script src="../../engine/web/text.js"></script>
<script src="../../engine/web/archive.js"></script>
<script src="../../engine/web/assets.js"></script>
<script src="shots/prologue.js"></script>
<script src="shots/altar.js"></script>
<script src="shots/place.js"></script>
<script src="shots/origin.js"></script>
<script src="shots/mind.js"></script>
<script src="shots/end.js"></script>
<script src="douyin/web/main.js"></script>
</body>
</html>
